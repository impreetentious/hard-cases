[workspace]
resolver = "3"
members = [
    "crates/hc-core",
    "crates/hc-bench",
    "crates/hc-cert",
    "crates/hc-cli",
    "crates/hc-cuts",
    "crates/hc-exact",
    "crates/hc-fuzz",
    "crates/hc-heur",
    "crates/hc-io",
    "crates/hc-lp",
    "crates/hc-mip",
    "crates/hc-presolve",
    "crates/hc-tamper",
    "crates/hc-verify",
    "crates/hc-wasm",
]

[workspace.package]
version = "0.13.0"
authors = ["Sidakpreet Singh"]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Solver crates inherit this table. `disallowed_types` is what makes
# `clippy.toml`'s ban on unordered maps and ambient clocks real, so it is
# denied rather than merely warned: a hash-ordered iteration in a pricing loop
# or a clock in a budget check is a determinism bug, not a style opinion.
#
# Host crates (the CLI, the bench harness, the WASM surface) legitimately read
# clocks and touch the filesystem. They declare their own lint table and allow
# `disallowed_types` explicitly, so the deterministic perimeter stays narrow
# enough to mean something.
#
# `priority = -1` on the group is load-bearing: without it Cargo can pass the
# group flag after the specific one and silently re-enable what a crate meant
# to allow.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"
