name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: node scripts/check-version-coherence.mjs
      # Every relative link in every document points at something that exists.
      - run: node scripts/ci/links.mjs
      # The contracts the assets name are real: every rejection identifier is
      # one some implementation can produce, and every trap names a test.
      - run: node scripts/ci/contracts.mjs
      # The normative assets are checked before anything is compiled: a broken
      # rule invalidates the code that satisfies it, not the other way round.
      - run: node scripts/gen-docs.mjs --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ./scripts/ci/forbidden-grep.sh
      # Both ways. The debug run is where an arithmetic overflow panics rather
      # than wrapping; the release run is where the campaigns finish.
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets --release
      # The two front doors, on the real executables. A certificate is checked
      # by the standalone binary with none of the solver linked, and by the
      # wrapper the command line offers, and the two must agree byte for byte.
      - run: ./scripts/ci/parity.sh
      # Every artifact produced twice in separate processes and compared byte
      # for byte: the canonical dump, the certificate, the explanation, the
      # trace, and the verifier's verdict and work units.
      - run: ./scripts/ci/determinism.sh
      # The browser surface, built and driven in a WebAssembly host. The target
      # comes from rust-toolchain.toml, so a machine that cannot build it is a
      # machine that has not been set up the way this project says it is.
      - run: ./scripts/ci/wasm.sh
      # The page: built from what the Rust build just produced, held to its
      # byte budgets, and driven in a real browser against the built bundle
      # rather than against a development server.
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: theater/package-lock.json
      - run: cargo build --release -p hc-cli
      - run: npm --prefix theater ci
      - run: npx --prefix theater playwright install --with-deps chromium
      - run: ./scripts/ci/theater.sh
      # The certification campaign at its nightly size, under release
      # optimizations. A hundred thousand generated instances, each solved,
      # rebuilt exactly, and rechecked by the standalone verifier.
      - run: cargo test --release -p hc-bench --test certification -- --ignored
      # Tiny integer programs answered three ways: by the search, by looking at
      # every point, and by the standalone verifier replaying the tree.
      - run: cargo test --release -p hc-bench --test tiny_milp -- --ignored
      # The two simplex methods against each other on generated instances.
      - run: cargo test --release -p hc-bench --test dual_campaign -- --ignored
      # The fuzz corpus at its nightly size: a million generated and mutated
      # files through both readers, damaged certificates through the verifier,
      # and generated instances solved, certified, and rechecked. Every case
      # comes from a seed, so a finding here reproduces on a laptop by running
      # the seed it names.
      - run: cargo run --release -p hc-fuzz --bin hc-fuzz -- --nightly
      # Every combination of the search's settings, on every instance, against
      # enumeration and against a verified certificate.
      - run: cargo test --release -p hc-bench --test tiny_milp the_nightly_sweep -- --ignored
      - run: cargo doc --workspace --no-deps
