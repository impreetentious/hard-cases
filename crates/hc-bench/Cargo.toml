[package]
name = "hc-bench"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hc-core = { path = "../hc-core" }
hc-exact = { path = "../hc-exact" }
hc-io = { path = "../hc-io" }
# The harness drives the production solver; the reference solver beside it does
# not, and a gate refuses the build if that ever changes.
hc-lp = { path = "../hc-lp" }
hc-cert = { path = "../hc-cert" }
# The tamper corpus, which the campaign here runs against the standalone
# verifier. It lives in its own crate because the browser surface offers the
# same entries to a visitor and should not have to take a benchmark harness to
# reach them.
hc-tamper = { path = "../hc-tamper" }
hc-cuts = { path = "../hc-cuts" }
hc-mip = { path = "../hc-mip" }
hc-presolve = { path = "../hc-presolve" }
# The trust-boundary receipt, whose figures the front page's counters carry.
# Its own crate so that the command line can offer `hc receipt` without taking
# this harness — and the reference solver in it — along; see ADR-0019.
hc-receipt = { path = "../hc-receipt" }

# The proof campaign hands every certificate it assembles to the standalone
# verifier, which is a caller using a public interface. The edge runs one way
# and a gate refuses the build if it ever runs the other.
hc-verify = { path = "../hc-verify" }

[lints]
workspace = true
