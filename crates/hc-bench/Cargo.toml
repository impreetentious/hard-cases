[package]
name = "hc-bench"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hc-core = { path = "../hc-core" }
hc-exact = { path = "../hc-exact" }
hc-io = { path = "../hc-io" }
# The harness drives the production solver; the reference solver beside it does
# not, and a gate refuses the build if that ever changes.
hc-lp = { path = "../hc-lp" }
# The tamper corpus forges certificates, which means encoding and decoding
# them the way the solver does. It never verifies one; that is the other
# side's job and the whole point of the exercise.
hc-cert = { path = "../hc-cert" }

# The proof campaign hands every certificate it assembles to the standalone
# verifier, which is a caller using a public interface. The edge runs one way
# and a gate refuses the build if it ever runs the other.
hc-verify = { path = "../hc-verify" }

[lints]
workspace = true
