[package]
name = "hc-cert"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hc-core = { path = "../hc-core" }
hc-exact = { path = "../hc-exact" }
hc-lp = { path = "../hc-lp" }
# The tree a certificate serializes is the tree the search built, in the order
# it built it. Reading it here rather than rebuilding it is what keeps the
# proof an account of what happened.
hc-mip = { path = "../hc-mip" }

[dev-dependencies]
hc-io = { path = "../hc-io" }
hc-verify = { path = "../hc-verify" }

[lints]
workspace = true
