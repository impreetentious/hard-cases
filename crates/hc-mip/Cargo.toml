[package]
name = "hc-mip"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hc-core = { path = "../hc-core" }
# The search screens candidate incumbents exactly, against the original model,
# before any of them is allowed to prune anything. That is the reason for this
# edge and the only reason.
hc-exact = { path = "../hc-exact" }
# A heuristic proposes and the search disposes: every candidate this crate
# accepts from `hc-heur` goes through the same exact screening a node's own
# integral vertex does, which is why the dependency runs this way and never
# back.
hc-heur = { path = "../hc-heur" }
hc-cuts = { path = "../hc-cuts" }
hc-lp = { path = "../hc-lp" }

[dev-dependencies]
hc-io = { path = "../hc-io" }

[lints]
workspace = true
