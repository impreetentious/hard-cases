# Hand-worked inference vectors, version 1.
#
# Every derivation here was done with a pencil and can be rechecked with one.
# That is the requirement: a vector produced by running the verifier is a
# recording of what the verifier does, and would agree with a wrong verifier
# forever. The models are small enough that the arithmetic is obvious and the
# expected verdict is a claim about the calculus rather than about the code.
#
# Each negative vector names one rejection identifier, and it must be the
# earliest check that fires. A mutation caught late is a mutation that got past
# a check that should have stopped it.

[meta]
version = 1
title = 'Hand-worked inference vectors v1'
summary = 'Positive and negative vectors for the dual, contradiction, cut, and transform rules.'

# ===========================================================================
# DualBound
# ===========================================================================
#
# Model A, which is the vectors/mps/tiny.mps instance:
#   minimize  -x
#   subject to        x <= 4
#             0 <=    x <= 10,  x integer
# Canonical inequalities, per canonical.toml:
#   0:  -x >= -4     the row upper side
#   1:   x >=  0     the variable lower bound
#   2:  -x >= -10    the variable upper bound
# Objective vector is (-1) and the objective constant is 0.

[dual.model_a]
instance = '../mps/tiny.mps'
objective = '-1'
objective_constant = '0'
inequalities = ['0: -x >= -4', '1: x >= 0', '2: -x >= -10']

[dual.tight_bound]
model = 'model_a'
multipliers = ['0: 1']
verdict = 'accept'
bound = '-4'
working = 'One times the coefficient vector of inequality 0 is (-1), which equals the objective vector. The bound is the objective constant plus one times -4, so L = -4. The incumbent x = 4 has objective -4, so L equals U and the claim canonicalizes to optimal.'

[dual.weaker_bound]
model = 'model_a'
multipliers = ['2: 1']
verdict = 'accept'
bound = '-10'
working = 'The variable upper bound also has coefficient vector (-1), so it too sums to the objective. The resulting bound of -10 is valid and weak. A valid weak bound is accepted: the calculus establishes truth, not quality, and a solver that emits this instead of the tight bound has a search defect rather than a proof defect.'

[dual.combined]
model = 'model_a'
multipliers = ['0: 1/2', '2: 1/2']
verdict = 'accept'
bound = '-7'
working = 'Half of each upper bound sums to (-1) as well, giving -2 plus -5 = -7. Included because an implementation that special-cases a single multiplier passes the two vectors above and fails here.'

[dual.negative_multiplier]
model = 'model_a'
multipliers = ['0: -1']
verdict = 'reject'
id = 'HCC-DUAL-01'
working = 'A negative multiplier reverses the inequality it is applied to. This is the single mutation that turns the rule from sound into arbitrary, so it is checked before the sum is formed rather than after.'
trap = 'trap_negative_dual_multiplier'

[dual.zero_multiplier]
model = 'model_a'
multipliers = ['0: 1', '1: 0']
verdict = 'reject'
id = 'HCC-DUAL-02'
working = 'The sum is correct and the bound is correct, and the record is still rejected. A zero multiplier contributes nothing and gives one inference two encodings, which would make the certificate bytes depend on something with no meaning.'

[dual.wrong_bound]
model = 'model_a'
multipliers = ['0: 1']
claimed_bound = '-3'
verdict = 'reject'
id = 'HCC-DUAL-03'
working = 'The multipliers are valid and the derivation is sound; only the stated bound is wrong. The verifier recomputes -4 and compares. This is the vector behind the rejection message the README quotes, and it is the reason the recomputed value rather than the stated one is what a claim is closed against.'
trap = 'trap_recompute_not_restate'

[dual.coefficients_do_not_sum]
model = 'model_a'
multipliers = ['1: 1']
verdict = 'reject'
id = 'HCC-DUAL-04'
working = 'Inequality 1 has coefficient vector (1), which is not the objective vector (-1). The multiplied inequality is true, and the conclusion drawn from it would not be. Truth of the parts is not the check; the sum is.'

# ===========================================================================
# Contradiction
# ===========================================================================
#
# Model B:
#   minimize  0
#   subject to        x <= 2
#             3 <=    x
# Canonical inequalities:
#   0:  -x >= -2     the row upper side
#   1:   x >=  3     the variable lower bound

[contradiction.model_b]
inequalities = ['0: -x >= -2', '1: x >= 3']
note = 'The variable lower bound is a canonical inequality with an identifier, exactly like the row side. That is what makes the witness below complete.'

[contradiction.complete]
model = 'model_b'
multipliers = ['0: 1', '1: 1']
verdict = 'accept'
working = 'The coefficients sum to -1 plus 1 = 0, and the right-hand sides sum to -2 plus 3 = 1, which is strictly positive. Zero is therefore at least one, and the model has no feasible point.'

[contradiction.missing_bound_multiplier]
model = 'model_b'
multipliers = ['0: 1']
verdict = 'reject'
id = 'HCC-DUAL-05'
working = 'The classic omission: a Farkas witness over rows only, with the variable bounds assumed available by convention. Here there is no convention to lean on, the coefficient sum is -1 rather than zero, and the record is rejected.'
trap = 'trap_infeasible_farkas_bounds'

[contradiction.nonpositive_rhs]
model = 'model_b'
multipliers = ['0: 1', '1: 2/3']
verdict = 'reject'
id = 'HCC-DUAL-05'
working = 'Coefficients sum to -1 plus 2/3, which is not zero, so the earlier check fires first. The vector exists to pin the order: an implementation checking the right-hand side before the coefficient vector would report the wrong identifier here.'

# ===========================================================================
# Gomory mixed integer
# ===========================================================================
#
# A reconstructed tableau equation with one term in each of the four quadrants
# of the formula. Swapping any two of them yields a cut that is valid on most
# instances and wrong on some, which is why each quadrant has its own term here.
#
#   z + (3/4) w1 + (5/4) w3 + (-1/2) w2 + (2/3) w4 = 7/3
#
# w1 and w3 are integer displacements, w2 and w4 continuous.

[gmi.four_quadrants]
equation = 'z + (3/4) w1 + (5/4) w3 + (-1/2) w2 + (2/3) w4 = 7/3'
integer_nonbasics = ['w1', 'w3']
continuous_nonbasics = ['w2', 'w4']
beta = '7/3'
f = '1/3'
verdict = 'accept'
cut = '(1/8) w1 + (1/4) w3 + (1/4) w2 + (2/3) w4 >= 1/3'

[gmi.four_quadrants.working]
f = 'beta minus its floor is 7/3 minus 2, which is 1/3, and it is strictly between zero and one as the rule requires.'
w1 = 'Integer with a_1 = 3/4, so f_1 = 3/4, which is greater than f. The large-fraction branch gives f (1 - f_1) / (1 - f) = (1/3)(1/4)/(2/3) = 1/8.'
w3 = 'Integer with a_3 = 5/4, so f_3 = 1/4, which is at most f. The small-fraction branch gives f_3 itself, which is 1/4.'
w2 = 'Continuous with a_2 = -1/2, which is negative. The branch gives -f a_2 / (1 - f) = (1/3)(1/2)/(2/3) = 1/4.'
w4 = 'Continuous with a_4 = 2/3, which is nonnegative. The branch gives a_4 itself, which is 2/3.'

[gmi.swapped_integer_branches]
equation = 'z + (3/4) w1 + (5/4) w3 + (-1/2) w2 + (2/3) w4 = 7/3'
claimed_cut = '(3/4) w1 + (1/4) w3 + (1/4) w2 + (2/3) w4 >= 1/3'
verdict = 'reject'
id = 'HCC-CUT-05'
working = 'The two integer branches are swapped, so w1 receives f_1 = 3/4 instead of 1/8. The resulting inequality is stronger than the valid cut and removes integer-feasible points. This is the mutation the quadrant trap exists for.'
trap = 'trap_gomory_formula_quadrants'

[gmi.integral_beta]
equation = 'z + (3/4) w1 = 2'
verdict = 'reject'
id = 'HCC-CUT-04'
working = 'The right-hand side is an integer, so f is zero and the cut would be vacuous. A rule that produced 0 >= 0 here would be sound and useless, and would let a certificate carry cut records that mean nothing.'

[gmi.free_nonbasic]
equation = 'z + (3/4) w1 = 7/3'
nonbasic_state = 'w1 sits at no finite bound'
verdict = 'reject'
id = 'HCC-CUT-02'
working = 'There is no displacement to write for a nonbasic at no finite bound, and the formula has no meaning without one.'

[gmi.noninteger_endpoint]
equation = 'z + (3/4) w1 = 7/3'
nonbasic_state = 'w1 is an integer variable displaced from a lower bound of 1/2'
verdict = 'reject'
id = 'HCC-CUT-03'
working = 'A unit step in the displacement of an integer variable must be a unit step in the variable. Measuring from a fractional endpoint breaks that, and every integer term of the formula assumes it.'

# ===========================================================================
# Knapsack cover with sequential lifting
# ===========================================================================
#
# Source row, every variable binary:
#   7 x1 + 6 x2 + 7 x3 + 3 x4 <= 12

[cover.model_c]
row = '7 x1 + 6 x2 + 7 x3 + 3 x4 <= 12'
variables = 'all binary'

[cover.lifted]
model = 'model_c'
cover = ['x1', 'x2']
lift_order = ['x3', 'x4']
verdict = 'accept'
base_cut = 'x1 + x2 <= 1'
lifted_cut = 'x1 + x2 + x3 <= 1'
alpha = ['x3: 1', 'x4: 0']

[cover.lifted.working]
cover_condition = 'The cover weights sum to 7 plus 6 = 13, which strictly exceeds the capacity 12, so the cover is a cover and the base cut is valid.'
x3 = 'Fix x3 to one, leaving capacity 5. Neither cover member fits in 5, so the maximum of x1 + x2 is 0, and alpha_3 = (2 - 1) - 0 = 1.'
x4 = 'Fix x4 to one, leaving capacity 9, with x3 now carrying coefficient 1. Any single one of x1, x2, x3 fits and any pair of them weighs at least 13, so the maximum is 1 and alpha_4 = 1 - 1 = 0.'
validity = 'The final cut says no two of x1, x2, x3 may be chosen together, which is true because every pair of them weighs at least 13 against a capacity of 12.'

[cover.not_strict]
model = 'model_c'
cover = ['x1', 'x4']
verdict = 'reject'
id = 'HCC-CUT-07'
working = 'The weights sum to 7 plus 3 = 10, which does not exceed 12. The proposed cut x1 + x4 <= 1 removes the feasible point where both are one. The condition is written as a strict inequality for exactly this case, and a reading that accepted equality would be wrong here and nowhere obvious.'
trap = 'trap_cover_not_strict'

[cover.overstated_lift]
model = 'model_c'
cover = ['x1', 'x2']
lift_order = ['x3', 'x4']
claimed_alpha = ['x3: 2', 'x4: 0']
verdict = 'reject'
id = 'HCC-CUT-11'
working = 'The stated lifting coefficient for x3 is 2 where the dynamic program computes 1. The resulting cut would forbid x3 alone, which is feasible. The verifier runs the program rather than reading the coefficient, so the mutation is caught by recomputation and not by a plausibility check.'
trap = 'trap_cover_lift_dp'

[cover.nonbinary_source]
model = 'model_c'
note = 'The same row with x4 declared general integer with bounds 0 and 3.'
cover = ['x1', 'x2']
verdict = 'reject'
id = 'HCC-CUT-08'
working = 'The derivation is stated for binary variables and its dynamic program enumerates zero-one states. A general integer in the source row makes the maximization a different problem, and the coefficients it would produce are not the ones the formula specifies.'
