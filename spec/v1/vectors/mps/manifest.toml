# MPS vectors, version 1.
#
# Every entry names an instance file and what both strict parsers must do with
# it. An accepted file names the canonical dump both must emit byte for byte; a
# rejected file names the single identifier both must produce. The negative half
# is the more important half: an accepted-file vector shows that a parser works,
# and a rejected-file vector shows that a check exists at all.

[meta]
version = 1
title = 'MPS parser vectors v1'
summary = 'Instance files paired with expected canonical dumps or expected rejection identifiers.'
format_tag = 1
note = 'Every file here is fixed-form MPS and is read under the fixed-form tag. Free-form variants of the same files are generated by the differential harness rather than checked in, because the two forms of one model must produce different digests and identical dumps below the digest line.'

# ---------------------------------------------------------------------------
# Accepted
# ---------------------------------------------------------------------------

[accept.tiny]
file = 'tiny.mps'
canon = 'tiny.canon'
digest = 'b4e79af6380a28d64f5664980bb3d252b7d45ce527ddc7eeeab2e0db160dce8d'
covers = 'The smallest complete instance: one integer column, one inequality row, a negative objective coefficient, and a UI bound that both sets an upper bound and marks the column integer.'

[accept.ranges]
file = 'ranges.mps'
canon = 'ranges.canon'
digest = '697801e90aabe574a1223ccd07633c2507894f3870d6b2e31e485bf8aed35f6b'
covers = 'Every row sense crossed with every range sign, which is the single most consequential disagreement between MPS readers. Also exercises the fifth and sixth fixed-form field windows and an FR bound.'
trap = 'trap_free_mps_ranges'

[accept.exact]
file = 'exact.mps'
canon = 'exact.canon'
digest = '8cc68c6b3214f996502e8a650ae89d69b046ec044d8f0d69f951050cccd0009c'
covers = 'Decimal text a float round-trip would corrupt, a scientific-notation coefficient, duplicate entries that sum, duplicate entries that cancel to zero, an objective constant supplied through the RHS section, and a BV bound.'
assertions = ['0.1 becomes 1/10 and not the nearest binary64', '1.5e2 becomes the integer 150', 'the cancelling pair leaves a zerosum note rather than nothing', 'the RHS entry on the objective row yields an objective constant of -5, negated']
trap = 'trap_exact_from_text'

# ---------------------------------------------------------------------------
# Rejected
# ---------------------------------------------------------------------------

[reject.unknown_bound_type]
file = 'reject/unknown-bound-type.mps'
id = 'HC-INSTANCE-17'
covers = 'A semicontinuous bound. Supporting it is a stated non-goal and approximating it would change the feasible set silently.'
trap = 'trap_mps_unsupported_bound_type'

[reject.multiple_rhs_vectors]
file = 'reject/multiple-rhs-vectors.mps'
id = 'HC-INSTANCE-16'
covers = 'Two distinct RHS vector names. Taking the first is the common behaviour and is a silent choice between two models.'
trap = 'trap_mps_multiple_vectors'

[reject.no_objective_row]
file = 'reject/no-objective-row.mps'
id = 'HC-INSTANCE-11'
covers = 'No free row to serve as the objective. Defaulting to a zero objective would answer a feasibility question while appearing to answer an optimization one.'

[reject.duplicate_row_name]
file = 'reject/duplicate-row-name.mps'
id = 'HC-INSTANCE-14'
covers = 'Two rows sharing a name, which makes every later reference to that name ambiguous.'

[reject.negative_up_default_lower]
file = 'reject/negative-up-default-lower.mps'
id = 'HC-INSTANCE-19'
covers = 'A negative UP bound on a column still at the default lower bound of zero. Readers disagree about whether this implies a lower bound of negative infinity, and about whether it does so only for integer columns.'

[reject.noninteger_ui]
file = 'reject/noninteger-ui.mps'
id = 'HC-INSTANCE-18'
covers = 'A fractional value on an integer bound record. Rounding it would change the feasible set with no transform record to show for it.'

[reject.ranges_on_objective]
file = 'reject/ranges-on-objective.mps'
id = 'HC-INSTANCE-23'
covers = 'A RANGES entry naming the objective row, which has no sense to range.'

[reject.noncontiguous_column]
file = 'reject/noncontiguous-column.mps'
id = 'HC-INSTANCE-22'
covers = 'A column resumed after another column started. Resuming and restarting are both defensible readings and they build different matrices.'

[reject.unbalanced_marker]
file = 'reject/unbalanced-marker.mps'
id = 'HC-INSTANCE-21'
covers = 'An INTORG with no closing INTEND, which leaves the integrality of every following column dependent on where the file happens to end.'

[reject.infinity_token]
file = 'reject/infinity-token.mps'
id = 'HC-INSTANCE-07'
covers = 'A token spelling infinity where a number is expected. There is no rational for it.'

[reject.underflow_value]
file = 'reject/underflow-value.mps'
id = 'HC-INSTANCE-06'
covers = 'An exact nonzero coefficient that rounds to zero in binary64. The search would run on a model with a structural zero where the proof has a nonzero, and the two would be solving different problems.'

[reject.exponent_cap]
file = 'reject/exponent-cap.mps'
id = 'HC-INSTANCE-05'
covers = 'A twelve-character token naming a rational of roughly three hundred million bits. The rejection must come from the projected bit length computed from the token, before any limb is allocated.'
trap = 'trap_numeric_exponent_cap'

[reject.unknown_section]
file = 'reject/unknown-section.mps'
id = 'HC-INSTANCE-08'
covers = 'A quadratic objective section. Ignoring what is not understood is reasonable for configuration and disastrous for a model a proof is about.'

[reject.missing_endata]
file = 'reject/missing-endata.mps'
id = 'HC-INSTANCE-26'
covers = 'Input ending before the terminating section, which is what a truncated download looks like.'
