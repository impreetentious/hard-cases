# Big-integer and rational vectors, version 1.
#
# Two independently written arithmetic stacks live in this repository, one in
# hc-exact for the solver and one in hc-verify for the verifier, and neither may
# call the other or be generated from the other. These literal operands and
# results are what they are held against instead. Operand sizes are chosen to
# land on the places implementations break: limb boundaries, the Karatsuba
# threshold at thirty-two limbs, borrow chains that propagate the full length of
# a number, and the division correction step that most schoolbook implementations
# get right only by accident.
#
# Every value is decimal, in the canonical rational text of canonical.toml.

[meta]
version = 1
title = 'Big-integer and rational vectors v1'
summary = 'Literal operands and results for the two independent arithmetic implementations.'

[biguint.add_limb_carry]
op = 'add'
a = '18446744073709551615'
b = '1'
result = '18446744073709551616'
covers = 'A carry out of the single limb, producing a number one limb longer.'

[biguint.add_full_carry]
op = 'add'
a = '340282366920938463463374607431768211455'
b = '1'
result = '340282366920938463463374607431768211456'
covers = 'A carry propagating through every limb and extending the length.'

[biguint.sub_borrow_chain]
op = 'sub'
a = '340282366920938463463374607431768211456'
b = '1'
result = '340282366920938463463374607431768211455'
covers = 'A borrow propagating through every limb, the mirror of the carry case.'

[biguint.sub_to_zero]
op = 'sub'
a = '222232244629420445529739893461909967206666939096499764990979600'
b = '222232244629420445529739893461909967206666939096499764990979600'
result = '0'
covers = 'Subtraction to exactly zero, which must normalize away every leading zero limb rather than leave a zero-valued number of nonzero length.'

[biguint.mul_max_limbs]
op = 'mul'
a = '18446744073709551615'
b = '18446744073709551615'
result = '340282366920938463426481119284349108225'
covers = 'The largest single-limb product, which overflows a 64-bit accumulator and requires a widening multiply.'

[biguint.mul_factorials]
op = 'mul'
a = '2432902008176640000'
b = '15511210043330985984000000'
result = '37737254063669622951147441236213760000000000'
covers = 'A published multi-limb product below the Karatsuba threshold, exercising the schoolbook path.'

[biguint.mul_karatsuba]
op = 'mul'
a = ''
b = ''
result = ''
covers = 'Both operands above the thirty-two limb Karatsuba threshold, so the recursive path runs and must agree with schoolbook.'

[biguint.mul_karatsuba_uneven]
op = 'mul'
a = ''
b = '7'
result = ''
covers = 'One operand above the threshold and one far below it, the asymmetric split that recursive multiplication most often mishandles.'

[biguint.divmod_quotient]
op = 'divmod_q'
a = '115792089237316195423570985008687907853269984665640564039457584007913129639935'
b = '18446744073709551617'
result = '6277101735386680763495507056286727952657427581105975853055'
covers = 'A multi-limb division whose divisor is just above a limb boundary, so normalization shifts by nearly a full limb.'

[biguint.divmod_remainder]
op = 'divmod_r'
a = '115792089237316195423570985008687907853269984665640564039457584007913129639935'
b = '18446744073709551617'
result = '0'
covers = 'The remainder of the same division. It must be strictly below the divisor and the pair must reconstruct the numerator exactly.'

[biguint.divmod_correction_q]
op = 'divmod_q'
a = '6277101735386680763835789423207666416083908700390324961280'
b = '340282366920938463463374607431768211455'
result = '18446744073709551616'
covers = 'A division whose trial digit overestimates, so the correction step runs. An implementation that omits the correction produces a quotient one too large here and nowhere else in this file.'

[biguint.divmod_correction_r]
op = 'divmod_r'
a = '6277101735386680763835789423207666416083908700390324961280'
b = '340282366920938463463374607431768211455'
result = '0'
covers = 'The remainder of the correction case.'

[biguint.divmod_by_one]
op = 'divmod_q'
a = '265252859812191058636308480000000'
b = '1'
result = '265252859812191058636308480000000'
covers = 'Division by one, the degenerate case where normalization shifts by zero bits.'

[biguint.divmod_smaller]
op = 'divmod_q'
a = '5'
b = '7'
result = '0'
covers = 'A numerator smaller than the divisor, which must short-circuit to a zero quotient rather than enter the loop.'

[biguint.gcd_consecutive_fibonacci]
op = 'gcd'
a = '280571172992510140037611932413038677189525'
b = '453973694165307953197296969697410619233826'
result = '1'
covers = 'Consecutive Fibonacci numbers, the worst case for the Euclidean algorithm and therefore the longest shift chain for a binary one.'

[biguint.gcd_shared_powers]
op = 'gcd'
a = '910043815000214977332758527534256632492715260325658624'
b = '3026129320496825594530516643625426310831441226804886503424'
result = '867885413170065858204611327680832512371745357824'
covers = 'A common factor with a large power of two in it, so the binary algorithm trailing-zero handling is exercised on both operands.'

[biguint.gcd_with_zero]
op = 'gcd'
a = '0'
b = '2432902008176640000'
result = '2432902008176640000'
covers = 'The identity case. A binary implementation that loops on trailing zeros hangs here unless zero is handled first.'

[rational.normalize_common_factor]
op = 'normalize'
a = '6/4'
result = '3/2'
covers = 'Reduction by the greatest common divisor on construction. An unnormalized rational compares unequal to its own value.'

[rational.normalize_sign]
op = 'normalize'
a = '-6/4'
result = '-3/2'
covers = 'The sign lives on the numerator. A negative denominator has no canonical text.'

[rational.normalize_zero]
op = 'normalize'
a = '0/5'
result = '0'
covers = 'Zero normalizes to a denominator of one and is written as the bare integer.'

[rational.normalize_integer]
op = 'normalize'
a = '12/4'
result = '3'
covers = 'A denominator of one is never written.'

[rational.add]
op = 'add'
a = '1/3'
b = '1/6'
result = '1/2'
covers = 'Addition whose result reduces further than either operand, so the reduction cannot be skipped when denominators differ.'

[rational.add_to_zero]
op = 'add'
a = '1/3'
b = '-1/3'
result = '0'
covers = 'Addition to exactly zero, which must produce canonical zero rather than a zero numerator over three.'

[rational.mul_to_one]
op = 'mul'
a = '2/3'
b = '3/2'
result = '1'
covers = 'Multiplication to exactly one, where cross-cancellation must happen before or after but exactly once.'

[rational.mul_sign]
op = 'mul'
a = '-2/3'
b = '3/4'
result = '-1/2'
covers = 'Sign propagation through a product that also reduces.'

[rational.sub]
op = 'sub'
a = '1/2'
b = '1/3'
result = '1/6'
covers = 'Subtraction with unequal denominators.'

[rational.div]
op = 'div'
a = '1/2'
b = '1/3'
result = '3/2'
covers = 'Division as multiplication by the reciprocal, with the sign carried correctly.'

[rational.big_coprime]
op = 'normalize'
a = ''
result = ''
covers = 'A rational whose numerator and denominator are both above the Karatsuba threshold and share no factor, so the reduction does maximal work and changes nothing.'

[rational.compare_close]
op = 'compare'
a = '355/113'
b = '22/7'
result = 'greater'
covers = 'Two close approximations of the same irrational. Comparing them by cross-multiplication is exact; comparing them as floats is not, and the two disagree.'

[decimal.one_tenth]
text = '0.1'
result = '1/10'
covers = 'The vector the whole exactness rule exists for. A float round-trip yields 3602879701896397/36028797018963968 instead.'

[decimal.scientific_positive]
text = '1.5e2'
result = '150'
covers = 'A positive exponent that clears the fractional digits and yields an integer.'

[decimal.scientific_negative]
text = '-1.25e-2'
result = '-1/80'
covers = 'A negative exponent combined with a sign and a fraction that reduces.'

[decimal.capital_exponent]
text = '2.5E+3'
result = '2500'
covers = 'A capital exponent marker with an explicit positive sign.'

[decimal.negative_zero_text]
text = '-0.000'
result = '0'
covers = 'A signed zero in the input maps to canonical zero. Negative zero does not exist in the model.'

[decimal.thousandth]
text = '1e-3'
result = '1/1000'
covers = 'An exponent with no decimal point.'

[decimal.exact_binary_fraction]
text = '12.375'
result = '99/8'
covers = 'A value that is exactly representable in binary64, so the exact and rounded paths agree here and this vector cannot distinguish them. It is included so a failure elsewhere cannot be blamed on the conversion in general.'

[decimal.long_fraction]
text = '0.3333333333333333'
result = '3333333333333333/10000000000000000'
covers = 'Sixteen digits that are emphatically not one third. A parser that recognizes repeating decimals, or that goes through a float, produces a different number.'

[decimal.leading_zeros]
text = '007.50'
result = '15/2'
covers = 'Leading and trailing zeros in the input, which are not significant and must not reach the canonical text.'

