check = 'Sign of each direction component against the finite bounds.'
message = 'direction leaves a finite variable bound'

[reject.HCC-RAY-03]
group = 'HCC-RAY'
check = 'Objective inner product with the direction.'
message = 'objective does not strictly improve along the direction'

[reject.HCC-RAY-04]
group = 'HCC-RAY'
check = 'Base point against every row and bound of the original model.'
message = 'ray base point is not feasible'

[reject.HCC-RAY-05]
group = 'HCC-RAY'
check = 'Integrality of the base point where declared.'
message = 'ray base point is not integral where the model declares integrality'

[reject.HCC-RAY-06]
group = 'HCC-RAY'
check = 'Presence and sign of the integer step, for a mixed-integer claim.'
message = 'mixed-integer ray has no positive integer step'

[reject.HCC-RAY-07]
group = 'HCC-RAY'
check = 'Integrality of the stepped direction on each integer variable.'
message = 'stepped direction is not integral on an integer variable'

[reject.HCC-RAY-08]
group = 'HCC-RAY'
check = 'Record kinds present alongside a ray claim.'
message = 'ray certificate contains a transform, root, or tree record'

